name: SeeForMeAI
options:
  bundleIdPrefix: com.seeforme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  SeeForMeAI:
    type: application
    platform: iOS
    sources: [SeeForMeAI]
    info:
      path: SeeForMeAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: SeeForMe AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "SeeForMe AI uses the camera so you can photograph objects, signs, documents, and workplace equipment to have them described or read aloud."
        NSMicrophoneUsageDescription: "SeeForMe AI listens only while you tap the microphone button, so you can ask questions by voice."
        NSSpeechRecognitionUsageDescription: "Speech recognition turns your spoken questions into commands. It runs on-device when your Apple device supports it."
        NSLocationWhenInUseUsageDescription: "SeeForMe AI uses your location only when you ask it to announce where you are, find nearby places, get walking directions, or share your location."
        NSCalendarsFullAccessUsageDescription: "SeeForMe AI reads your upcoming events aloud only when you ask for your calendar or daily briefing."
        NSContactsUsageDescription: "SeeForMe AI looks up a contact's phone number only when you ask it to."
        SCXAPIKey: "$(SCX_API_KEY)"
        SCXEndpoint: "$(SCX_ENDPOINT)"
        AnthropicAPIKey: "$(ANTHROPIC_API_KEY)"
        ElevenLabsAPIKey: "$(ELEVENLABS_API_KEY)"
        SovereignRegion: "au-syd-1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seeforme.SeeForMeAI
        GENERATE_INFOPLIST_FILE: NO
  SeeForMeAITests:
    type: bundle.unit-test
    platform: iOS
    sources: [SeeForMeAITests]
    dependencies:
      - target: SeeForMeAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SeeForMeAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SeeForMeAIUITests]
    dependencies:
      - target: SeeForMeAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SeeForMeAI:
    build:
      targets:
        SeeForMeAI: all
    test:
      targets: [SeeForMeAITests, SeeForMeAIUITests]
